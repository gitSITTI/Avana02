# Requirements Consolidator: CI.
# Every command below is also a `make` target and was run locally before this file was written.
# THIS FILE has not been run on a GitLab runner. Expect to adjust image names for your runner's registry access.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never                      # one pipeline per push, not two
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [guard, test, boards, browser, image]

variables:
  # Behind a firewall? Set PYTHON_IMAGE to your internal mirror (and PIP_INDEX_URL to your PyPI mirror) in Settings > CI/CD > Variables.
  PYTHON_IMAGE: "docker.io/library/python"
  NODE_IMAGE: "docker.io/library/node"
  # The Playwright image carries Chromium and its system libraries. Its version must equal the one in prototype/requirements-test.txt (tools/test_workflows.py checks).
  PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright/python:v1.56.0-noble"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

.python:
  image: "$PYTHON_IMAGE:3.12-slim"
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths: [.cache/pip]

# 1. Real program data must never reach the repo. See tools/check_no_real_data.py.
#    Optional: define a CI/CD variable FORBIDDEN_TERMS (one regex per line: program code names, part-number or
#    document-number patterns) to also scan text files. Keep that list out of the repo. Without it, only the structure checks run,
#    and the job log says so.
guard:no-real-data:
  extends: .python
  stage: guard
  script:
    - pip install pytest
    - python -m pytest -q tools
    - python tools/check_no_real_data.py

# 1b. Secrets and private names must never reach the repo, now or anywhere in its history. gitleaks is the pinned release from
#     tools/run_gitleaks.py (checksum verified). The private-term list is a CI/CD variable of type FILE named DENYLIST_FILE
#     (Settings > CI/CD > Variables; the file holds one term per line; see SECURITY.md). The job FAILS without it, so a forgotten
#     variable cannot pass as a clean scan. On a fork or mirror that has no list, set the variable DENYLIST_OPTIONAL to 1 to skip only that part.
#     Needs git inside the job, so this uses the full python image, not -slim. Behind a firewall: set GITLEAKS_BASE_URL to a mirror of the release files.
guard:secrets:
  extends: .python
  stage: guard
  image: "$PYTHON_IMAGE:3.12"
  variables:
    GIT_DEPTH: "0"                     # the scans read every commit, not a shallow clone
    REQUIRE_GITLEAKS: "1"
  script:
    - python tools/run_gitleaks.py install
    - pip install pytest
    - python -m pytest -q -rs tools/test_secret_guards.py
    - python tools/run_gitleaks.py history
    - python tools/denylist_check.py ci

# 2. The input layer: file adapters, live connectors against in-memory fakes, the shared HTTP kit against real local servers, watch mode.
#    One optional check (PDF made by LibreOffice) is skipped here: no LibreOffice in this image, and that is expected.
test:reqin:
  extends: .python
  stage: test
  image: "$PYTHON_IMAGE:$PY-slim"
  parallel:
    matrix:
      - PY: ["3.11", "3.13"]
  script:
    - cd reqin
    - pip install ".[test]"
    - python -m pytest -q -rs --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: reqin/report.xml

# 2b. The connector template must keep working as shipped: a new connector starts from it.
test:connector-template:
  extends: .python
  stage: test
  script:
    - pip install -e "reqin[test]" -e connector_template
    - python -m pytest -q connector_template/tests
    - reqin connectors | grep -E "^acme "

# 3. The Excalidraw boards are generated. They must rebuild byte-for-byte from the committed code and be structurally valid.
#    Fails if someone edits a board by hand, or changes the generator without regenerating the boards.
boards:rebuild-identical:
  extends: .python
  stage: boards
  script:
    - cd excalidraw_generator
    - python build_all.py --check --out ../excalidraw
    - python validate.py ../excalidraw/*.excalidraw

# 3b. The interactive prototype is built from parts/. The committed page must equal a fresh build, and every template hole must resolve.
prototype:build-identical:
  extends: .python
  stage: boards
  script:
    - cd prototype
    - python build.py "$CI_PROJECT_DIR/Main.built.dc.html"
    - cmp "$CI_PROJECT_DIR/Main.built.dc.html" project/Main.dc.html

prototype:verify:
  stage: boards
  image: "$NODE_IMAGE:22-slim"
  script:
    - cd prototype
    - node verify.js project/Main.dc.html

# 3c. The prototype in a real browser, ten test files at three screen widths (the flows, the V, the gold set, keeping the work, the AI gate, and the
#     accessibility scan). The libraries come from the first job as an artifact, so the browser image needs no Node. The 30 runs took about 17 minutes in all where this was written (a busy machine).
prototype:vendor:
  stage: boards
  image: "$NODE_IMAGE:22-slim"
  script:
    - cd prototype/vendor
    - npm ci
  artifacts:
    paths: [prototype/vendor/node_modules]
    expire_in: 1 day

prototype:browser:
  stage: browser
  image: "$PLAYWRIGHT_IMAGE"
  needs: ["prototype:vendor"]
  timeout: 1h
  script:
    - pip install -r prototype/requirements-test.txt
    - cd prototype
    - python run_browser_tests.py

# 3d. The scale test: 20 times the sample (24,960 requirements) built in a temporary folder and timed. The full node image has the Python the build needs.
#     SCALE_SLACK doubles every limit for a shared runner; the limits themselves are about three times what a laptop needs.
prototype:scale:
  stage: browser
  image: "$NODE_IMAGE:22"
  variables:
    SCALE_SLACK: "2"
  script:
    - cd prototype
    - node scale.js

# 4. Container image (Podman). Manual by default because it needs a runner that allows building images.
#    Make it automatic by deleting the `when: manual` / `allow_failure` lines.
image:build:
  stage: image
  image: quay.io/podman/stable
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    IMAGE: "$CI_REGISTRY_IMAGE/reqin:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_REGISTRY && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG)
      when: manual
      allow_failure: true
  script:
    - podman build --target test -t "$IMAGE-test" -f Containerfile .      # runs the tests inside the build
    - podman build -t "$IMAGE" -f Containerfile .
    - podman run --rm "$IMAGE" --help
    - echo "$CI_REGISTRY_PASSWORD" | podman login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - podman push "$IMAGE"

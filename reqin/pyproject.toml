[project]
name = "reqin"
version = "0.2.0"
description = "Input-agnostic requirement ingestion: adapters + canonical model + declarative mapping"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["pyyaml", "openpyxl", "reqif>=0.0.48", "sqlalchemy", "python-docx", "pdfplumber"]

[project.optional-dependencies]
oslc = ["rdflib>=7"]                 # the DOORS Next / OSLC connector parses RDF
test = ["pytest", "reportlab", "rdflib>=7", "trustme"]

[project.scripts]
reqin = "reqin.cli:main"
reqin-server = "reqin.server.__main__:main"
reqin-gateway = "reqin.gateway.__main__:main"

[project.entry-points."reqin.adapters"]
# third-party packages add their adapter here:  myadapter = "my_pkg.adapter"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

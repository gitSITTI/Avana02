# Requirements Consolidator: CI on GitHub Actions. The same checks as .gitlab-ci.yml and `make check`.
# THIS FILE has not run on GitHub yet. Each job's commands were run locally in clean virtual environments first; expect to adjust
# the runner image or the action versions on the first real run.
#
# Safety choices (tools/test_workflows.py keeps them from drifting):
#   - the workflow token is read-only (permissions: contents: read) and no job asks for more
#   - triggers are push to main, pull_request and a manual run. Never pull_request_target: it hands a secret-bearing token to code from forks
#   - every third-party action is pinned to a full commit SHA; the version it is, is in the comment after it
#   - the one secret (FORBIDDEN_TERMS) reaches the one step that needs it. Pull requests from forks do not receive it,
#     so there the guard runs its structure checks only, and its log line says so

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # 1. Real program data must never reach the repo (tools/check_no_real_data.py). The tests in tools/ also check that the licence files agree,
  #    that every board and screenshot picture was made from the current board / page, and that every relative link in the Markdown files resolves.
  #    Optional: a repository secret FORBIDDEN_TERMS (one regex per line: program code names, part-number or document-number patterns)
  #    makes the guard also scan text files for them. Keep that list out of the repo.
  guard:
    name: guard (no real data, licence, pictures, links)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q tools
      - run: python tools/check_no_real_data.py
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

  # 2. The input layer: file adapters, live connectors against in-memory fakes, the shared HTTP kit against real local servers, watch mode.
  #    One optional check (a PDF made by LibreOffice) is skipped when the runner has no LibreOffice; the `-rs` flag shows in the log whether it ran.
  reqin:
    name: reqin tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
        working-directory: reqin
      - run: python -m pytest -q -rs
        working-directory: reqin

  # 2b. The connector template must keep working as shipped: a new connector starts from it.
  connector-template:
    name: connector template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e "reqin[test]" -e connector_template
      - run: python -m pytest -q connector_template/tests
      - run: reqin connectors | grep -E "^acme "

  # 3. The Excalidraw boards are generated. They must rebuild byte-for-byte from the committed code and be structurally valid.
  #    Fails if someone edits a board by hand, or changes the generator without regenerating the boards.
  boards:
    name: boards rebuild identical
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python build_all.py --check --out ../excalidraw
        working-directory: excalidraw_generator
      - run: python validate.py ../excalidraw/*.excalidraw
        working-directory: excalidraw_generator

  # 3b. The interactive prototype is built from prototype/parts/. The committed page must equal a fresh build, and every template hole must resolve.
  prototype:
    name: prototype build identical and verified
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python build.py "$RUNNER_TEMP/Main.built.dc.html"
        working-directory: prototype
      - run: cmp "$RUNNER_TEMP/Main.built.dc.html" prototype/project/Main.dc.html
      - run: node verify.js project/Main.dc.html
        working-directory: prototype

  # 4. Container image. Manual only (Actions > CI > Run workflow): the Containerfile has never been built, so this is its first real test.
  #    It builds and checks; it does not push anywhere.
  image:
    name: container image (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target test -t reqin-test -f Containerfile .
      - run: docker build -t reqin -f Containerfile .
      - run: docker run --rm reqin --help

# Requirements Consolidator: CI on GitHub Actions. The same checks as .gitlab-ci.yml and `make check`.
# THIS FILE has not run on GitHub yet. Each job's commands were run locally first (the browser tests and the scale test against the same pinned
# libraries and a local Chromium, in a clean copy of the repository); expect to adjust the runner image or the action versions on the first real run.
#
# Safety choices (tools/test_workflows.py keeps them from drifting):
#   - the workflow token is read-only (permissions: contents: read) and no job asks for more
#   - triggers are push to main, pull_request and a manual run. Never pull_request_target: it hands a secret-bearing token to code from forks
#   - every third-party action is pinned to a full commit SHA; the version it is, is in the comment after it
#   - the two secrets (FORBIDDEN_TERMS, DENYLIST) each reach only the one step that needs them. Pull requests from forks do not receive
#     them, so there the guard runs its structure checks only and the private-term check is skipped; each log line says so

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # 1. Real program data must never reach the repo (tools/check_no_real_data.py). The tests in tools/ also check that the licence files agree,
  #    that every board and screenshot picture was made from the current board / page, and that every relative link in the Markdown files resolves.
  #    Optional: a repository secret FORBIDDEN_TERMS (one regex per line: program code names, part-number or document-number patterns)
  #    makes the guard also scan text files for them. Keep that list out of the repo.
  guard:
    name: guard (no real data, licence, pictures, links)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Everything the tests in tools/ can use, so none of them skips for want of a library: Pillow and numpy (the picture tests, the drift gate), reqin and its
      # pyyaml (the dataset tests), and Playwright with Chromium at the pinned version (the browser tests). tools/test_ci_installs_test_dependencies.py fails if one goes missing.
      - run: pip install -r prototype/requirements-test.txt -e "reqin[test]" "pillow>=10" "numpy>=1.26"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs tools
      - run: python tools/check_no_real_data.py
        env:
          FORBIDDEN_TERMS: ${{ secrets.FORBIDDEN_TERMS }}

  # 1b. Secrets and private names must never reach the repo, now or anywhere in its history. gitleaks is the pinned release from
  #     tools/run_gitleaks.py (checksum verified); the private-term list is the repository secret DENYLIST (one term per line; see SECURITY.md).
  #     The job FAILS when that secret is missing, so a forgotten secret cannot pass as a clean scan. Only pull requests from forks, which are
  #     never given secrets, skip it. The log prints a count of places, never locations or terms, because a public repo's log is public.
  secrets:
    name: secrets (gitleaks, private terms)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/run_gitleaks.py install
      - run: pip install pytest
      - run: python -m pytest -q -rs tools/test_secret_guards.py
        env:
          REQUIRE_GITLEAKS: "1"
      - run: python tools/run_gitleaks.py history
      - run: python tools/denylist_check.py ci
        env:
          DENYLIST_TERMS: ${{ secrets.DENYLIST }}
          DENYLIST_OPTIONAL: ${{ github.event.pull_request.head.repo.fork && '1' || '' }}

  # 2. The input layer: file adapters, live connectors against in-memory fakes, the shared HTTP kit against real local servers, watch mode.
  #    One optional check (a PDF made by LibreOffice) is skipped when the runner has no LibreOffice; the `-rs` flag shows in the log whether it ran.
  reqin:
    name: reqin tests (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[test]"
        working-directory: reqin
      - run: python -m pytest -q -rs
        working-directory: reqin

  # 2b. The connector template must keep working as shipped: a new connector starts from it.
  connector-template:
    name: connector template
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e "reqin[test]" -e connector_template
      - run: python -m pytest -q connector_template/tests
      - run: reqin connectors | grep -E "^acme "

  # 3. The Excalidraw boards are generated. They must rebuild byte-for-byte from the committed code and be structurally valid.
  #    Fails if someone edits a board by hand, or changes the generator without regenerating the boards.
  boards:
    name: boards rebuild identical
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python build_all.py --check --out ../excalidraw
        working-directory: excalidraw_generator
      - run: python validate.py ../excalidraw/*.excalidraw
        working-directory: excalidraw_generator

  # 3b. The interactive prototype is built from prototype/parts/. The committed page must equal a fresh build, and every template hole must resolve.
  prototype:
    name: prototype build identical and verified
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: python build.py "$RUNNER_TEMP/Main.built.dc.html"
        working-directory: prototype
      - run: cmp "$RUNNER_TEMP/Main.built.dc.html" prototype/project/Main.dc.html
      - run: node verify.js project/Main.dc.html
        working-directory: prototype
      - run: node export_seed.js project/Main.dc.html "$RUNNER_TEMP/seed.built.json"
        working-directory: prototype
      - run: cmp "$RUNNER_TEMP/seed.built.json" prototype/demo/seed.json
      - run: python run_conn_test.py          # the shared-project engine against a real reference server (standard library only)
        working-directory: prototype

  # 3c. The prototype in a real browser (Chromium through Playwright), eleven test files at three screen widths: the flows, the V, the gold set, keeping the
  #     work, the AI gate, the shared project (four people in four browsers on one reference server) and the accessibility scan (axe-core 4.13 plus contrast, keyboard, reflow and chart-colour checks). A full run is 30 runs and took about 17 minutes where it
  #     was written (a busy machine); the runner prints one line for each and everything a failing one said. The page under test is the committed prototype/project/Main.dc.html.
  prototype-browser:
    name: prototype browser tests and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: prototype/vendor
      - run: pip install -r prototype/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python run_browser_tests.py
        working-directory: prototype

  # 3c-2. The same page in Firefox and WebKit, five of the test files at one width: opening a project, the first screens and the wording comparison, the trace map
  #       downloads, keeping the work (storage, saving and loading a file) and the accessibility scan. The tests were written and run against Chromium only, so
  #       this job is allowed to fail: a red result here is a thing to look at (a real difference between browsers, or a test that assumed Chromium), not a broken
  #       build. It has not run on GitHub yet, and the tests have never been run in these two browsers.
  prototype-other-browsers:
    name: prototype in ${{ matrix.browser }} (allowed to fail)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: prototype/vendor
      - run: pip install -r prototype/requirements-test.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python run_browser_tests.py b11 b12 b17 b18 b20 --width 1440
        working-directory: prototype
        env:
          REQIN_BROWSER: ${{ matrix.browser }}

  # 3d. The scale test: a page with 20 times the sample (24,960 requirements, 5,040 clusters) is built in a temporary folder and every page, the gold-set pair
  #     counts and the project files are timed against limits about three times what a laptop needs, twice: as the sample repeated and with a varied shape (see
  #     prototype/scale.js). SCALE_SLACK doubles the limits for a shared runner.
  prototype-scale:
    name: prototype scale test (25,000 requirements)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node scale.js 20 sample
        working-directory: prototype
        env:
          SCALE_SLACK: "2"
      - run: node scale.js 20 varied
        working-directory: prototype
        env:
          SCALE_SLACK: "2"

  # 4. Container image. Manual only (Actions > CI > Run workflow): the Containerfile has never been built, so this is its first real test.
  #    It builds and checks; it does not push anywhere.
  image:
    name: container image (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target test -t reqin-test -f Containerfile .
      - run: docker build -t reqin -f Containerfile .
      - run: docker run --rm reqin --help
